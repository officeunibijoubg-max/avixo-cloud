name: Дневни визуали

on:
  schedule:
    # 07:00 Европа/София. Cron е винаги в UTC, а България мени часа два пъти
    # годишно — затова са два реда, а проверката по-долу пуска само верния.
    - cron: '0 4 * * *'   # лятно време (EEST, UTC+3)
    - cron: '0 5 * * *'   # зимно време (EET,  UTC+2)
  workflow_dispatch:
    inputs:
      url:
        description: 'Конкретен продуктов URL (празно = по ротация)'
        required: false
      count:
        description: 'Брой варианти'
        required: false
        default: '12'

concurrency:
  group: daily-visuals
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Пали се само ако в София наистина е 7 часа. Двата cron-а покриват
      # лятното и зимното време; тази проверка спира грешния от двата.
      - name: Проверка на местния час
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          HOUR=$(TZ=Europe/Sofia date +%H)
          echo "В София е $HOUR ч."
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$HOUR" = "07" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Не е 7:00 местно време — пропускам."
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '20'
          cache: npm

      - name: Инсталация
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Рендер и качване
        if: steps.gate.outputs.run == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_PARENT_FOLDER_ID: ${{ secrets.DRIVE_PARENT_FOLDER_ID }}
          # Входът минава през променливи на средата, а не се интерполира с
          # ${{ }} вътре в командата — иначе стойност от формата може да
          # изпълни произволна shell команда на runner-а.
          PRODUCT_URL: ${{ github.event.inputs.url }}
          VARIANT_COUNT: ${{ github.event.inputs.count }}
        run: |
          ARGS="--count ${VARIANT_COUNT:-12}"
          if [ -n "$PRODUCT_URL" ]; then
            ARGS="$ARGS --url $PRODUCT_URL"
          fi
          node src/daily.mjs $ARGS

      # Ако качването се провали, поне визуалите да не се загубят.
      - name: Запази изхода при провал
        if: failure() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visuals-${{ github.run_id }}
          path: .work/out
          retention-days: 7
          if-no-files-found: ignore

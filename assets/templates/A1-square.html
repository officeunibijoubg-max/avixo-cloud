/* ═══ ЛЕЙАУТ — под тази линия няма нито един зашит цвят ════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#8E8E8B;display:grid;place-items:center;overflow:hidden;
  font-family:var(--f-ui);font-feature-settings:"locl" 0}
.fit{transform:scale(min(1,calc(100vw/1080),calc(100vh/1080)));transform-origin:center}

.canvas{width:var(--W);height:var(--H);position:relative;overflow:hidden;
  color:var(--fg);isolation:isolate;background:var(--bg)}
.grain{position:absolute;inset:0;pointer-events:none;
  opacity:var(--grain-op);mix-blend-mode:var(--grain-blend);
  background-image:radial-gradient(rgba(255,255,255,.55) .5px,transparent .5px),
                   radial-gradient(rgba(0,0,0,.5) .5px,transparent .5px);
  background-size:3px 3px,4px 4px;background-position:0 0,1px 2px}
.vign{position:absolute;inset:0;pointer-events:none;background:var(--vign)}
.frame{position:absolute;inset:18px;border:1px solid var(--frame-line);pointer-events:none}
.frame::before,.frame::after{content:"";position:absolute;width:36px;height:36px;
  border:1.5px solid var(--frame-corner);opacity:.75}
.frame::before{top:-1.5px;left:-1.5px;border-right:0;border-bottom:0}
.frame::after{bottom:-1.5px;right:-1.5px;border-left:0;border-top:0}

.stack{position:relative;z-index:3;height:100%;padding:var(--pad);display:flex;flex-direction:column}

/* ═══ Z1 · ЛОГО — темата избира коя версия се показва ══════════════════ */
.z-logo{display:flex;justify-content:center}
.z-logo img{width:184px;height:auto;opacity:.97}
.z-logo .logo-ink{display:var(--logo-ink,none);filter:drop-shadow(0 2px 6px rgba(0,0,0,.16))}
.z-logo .logo-cream{display:var(--logo-cream,none);filter:drop-shadow(0 3px 12px rgba(0,0,0,.75))}

/* ═══ Z2 · КУКА ═══════════════════════════════════════════════════════ */
.z-hook{text-align:center;margin-top:8px}
.kicker{display:flex;align-items:center;justify-content:center;gap:14px;
  font-size:var(--kicker);font-weight:700;letter-spacing:.26em;text-indent:.26em;
  color:var(--kick);text-transform:uppercase}
.kicker::before,.kicker::after{content:"";height:1px;width:70px;
  background:linear-gradient(90deg,transparent,var(--kick-line))}
.kicker::after{background:linear-gradient(270deg,transparent,var(--kick-line))}

/* Два ИДЕНТИЧНИ слоя (еднакви метрики): отзад контур, отпред градиент. */
.hook{position:relative;display:inline-block;margin-top:4px;
  font-family:var(--f-display);font-weight:900;font-size:var(--hook);
  line-height:1.04;letter-spacing:-.02em;white-space:nowrap}
.hook .lay{display:block}
.hook .stroke{position:absolute;inset:0;
  -webkit-text-stroke:var(--hook-stroke-w) var(--hook-stroke);color:var(--hook-stroke);
  filter:drop-shadow(var(--hook-shadow))}
.hook .fill{position:relative;background:var(--hook-grad);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hook u{text-decoration:none;font-size:.66em;font-weight:800;letter-spacing:0}

.subline{margin-top:5px;font-size:var(--subline);font-weight:600;
  letter-spacing:.15em;text-indent:.15em;text-transform:uppercase;color:var(--fg);opacity:.78}

/* ═══ Z3 · ЛЕНТА ══════════════════════════════════════════════════════ */
.z-ribbon{position:relative;margin:11px auto 0;width:max-content;padding:7px 44px}
.z-ribbon::before{content:"";position:absolute;inset:10px 0 8px;opacity:.94;
  background:var(--ribbon-grad);
  clip-path:polygon(0 42%,6% 8%,22% 0,52% 6%,80% 0,95% 12%,100% 46%,94% 92%,74% 100%,44% 94%,18% 100%,4% 84%)}
.z-ribbon b{position:relative;font-family:var(--f-script);font-weight:400;font-size:var(--ribbon);
  color:var(--ribbon-fg);text-shadow:0 1px 0 var(--ribbon-emboss)}

/* ═══ Z4/Z5/Z6 · СЦЕНА ════════════════════════════════════════════════ */
.z-stage{flex:1;position:relative;display:grid;grid-template-columns:1fr 306px;
  align-items:center;gap:4px;margin-top:2px}

/* ——— Z4 · ПРОДУКТ — границите се мерят при рендер, тук е само височината ——— */
.product{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
.halo{position:absolute;left:50%;top:48%;translate:-50% -50%;width:600px;height:560px;
  background:var(--halo);filter:blur(16px)}
.shot{position:relative;
  width:calc(var(--bw,1) * var(--k,0) * 1px);
  height:calc(var(--bh,1) * var(--k,0) * 1px)}
.shot img{position:absolute;
  width:calc(var(--nw,1) * var(--k,0) * 1px);
  left:calc(var(--bl,0) * var(--k,0) * -1px);
  top:calc(var(--bt,0) * var(--k,0) * -1px);
  filter:var(--prod-shadow)}
.shot::after{content:"";position:absolute;left:50%;bottom:-18px;translate:-50% 0;
  width:118%;height:42px;border-radius:50%;background:var(--ground);filter:blur(10px)}

/* ——— Z5 · ДОКАЗАТЕЛСТВА — винаги точно 3 ——— */
.z-proof{display:flex;flex-direction:column;gap:12px}
.pill{display:flex;align-items:center;gap:11px;padding:9px 15px 9px 9px;border-radius:999px;
  border:1px solid var(--card-br);background:var(--card-bg);box-shadow:var(--card-shadow)}
.pill i{flex:0 0 auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:var(--icon-grad);box-shadow:inset 0 -3px 6px rgba(0,0,0,.3)}
.pill i svg{width:22px;height:22px;fill:var(--icon-fg)}
.pill em{font-style:normal;font-weight:800;font-size:16px;letter-spacing:.035em;line-height:1.2;
  text-transform:uppercase;color:var(--card-fg)}
.pill em b{display:block;font-weight:600;font-size:13px;letter-spacing:.02em;text-transform:none;
  color:var(--card-sub);margin-top:2px}

/* ——— Z6 · ЦЕНА ——— */
.z-price{margin-top:15px;padding:11px 14px 10px;text-align:center;border-radius:22px;
  background:var(--price-bg);border:1.5px solid var(--price-br);box-shadow:var(--price-shadow)}
.z-price .was{font-size:17px;font-weight:600;color:var(--price-was);
  text-decoration:line-through;text-decoration-color:currentColor}
.z-price .was:empty{display:none}          /* без стара цена → редът изчезва */
.z-price .now{display:block;font-family:var(--f-display);font-weight:900;font-size:62px;line-height:1.08;
  background:var(--price-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.z-price .now u{text-decoration:none;font-size:.56em}
.z-price .note{display:block;margin-top:2px;font-size:16px;font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--price-note);opacity:.92}

/* ═══ Z7 · CTA ════════════════════════════════════════════════════════ */
.z-cta{margin-top:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:16px;width:100%;height:86px;
  border-radius:999px;font-size:var(--cta);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--cta-fg);background:var(--cta-bg);box-shadow:var(--cta-shadow)}
.btn svg{width:34px;height:34px;fill:var(--cta-fg)}
.btn .chev{width:20px;height:20px}

/* ═══ Z8 · ФУТЪР ══════════════════════════════════════════════════════ */
.z-foot{margin-top:9px;display:flex;align-items:center;justify-content:center;gap:12px;
  font-size:16px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--foot)}
.z-foot s{text-decoration:none;color:var(--foot-acc)}
.dot{width:5px;height:5px;border-radius:50%;background:var(--dot)}
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════════
   1) ПРОДУКТ — автоматична подготовка
   Снимките на avixo.eu са два вида: с алфа (комплектите) и на чист
   бял фон (единичните). Тук се обработват и двата, без ръчна работа.
   ═══════════════════════════════════════════════════════════════ */
function prepareProduct(img, shot){
  var w = img.naturalWidth, h = img.naturalHeight;
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  var ctx = c.getContext('2d', {willReadFrequently:true});
  ctx.drawImage(img, 0, 0);
  var id = ctx.getImageData(0, 0, w, h), p = id.data;
  var changed = false;
  var NEUT = 14;          /* фонът е неутрално сив; цветните пиксели се пазят */

  /* режим 'auto': решава по ъглите дали снимката е на бял фон */
  var mode = img.dataset.knockout || 'auto';
  if (mode === 'auto'){
    var anyAlpha = false;
    for (var a=3; a<p.length; a+=4){ if (p[a] < 250){ anyAlpha = true; break; } }
    var corners = [0, w-1, (h-1)*w, (h-1)*w + w-1];
    var whiteCorners = corners.every(function(ci){
      var o = ci*4;
      return p[o] >= 240 && p[o+1] >= 240 && p[o+2] >= 240 &&
             Math.max(p[o],p[o+1],p[o+2]) - Math.min(p[o],p[o+1],p[o+2]) <= 10;
    });
    mode = (!anyAlpha && whiteCorners) ? 'white' : 'none';
  }
  document.documentElement.dataset.knockoutMode = mode;

  if (mode === 'white') {
    var TOL = 222;        /* от хистограма: фон+мека сянка са >222, продуктът е <40 */
    var seen = new Uint8Array(w*h), stack = [];
    function isWhite(i){
      var o=i*4, r=p[o], g=p[o+1], b=p[o+2];
      if (r<TOL || g<TOL || b<TOL) return false;
      return Math.max(r,g,b) - Math.min(r,g,b) <= NEUT;
    }
    function seed(x,y){ var i=y*w+x; if(!seen[i] && isWhite(i)){ seen[i]=1; stack.push(i); } }
    for (var x=0; x<w; x++){ seed(x,0); seed(x,h-1); }
    for (var y=0; y<h; y++){ seed(0,y); seed(w-1,y); }
    while (stack.length){
      var i = stack.pop(), xx = i % w, yy = (i - xx) / w;
      p[i*4+3] = 0;
      if (xx>0)   seed(xx-1, yy);
      if (xx<w-1) seed(xx+1, yy);
      if (yy>0)   seed(xx, yy-1);
      if (yy<h-1) seed(xx, yy+1);
    }

    /* фаза 2: меките сиви сенки не са бели, затова заливането не ги хваща.
       Разрастваме прозрачността навътре само в неутрални пиксели над FLOOR
       и само до DMAX px дълбочина — тъмният продукт спира растежа сам. */
    var FLOOR = 176, DMAX = 70;
    var q = new Int32Array(w*h), head = 0, tail = 0, dep = new Uint8Array(w*h);
    for (var s=0; s<w*h; s++) if (p[s*4+3] === 0) q[tail++] = s;
    while (head < tail){
      var ci = q[head++], cd = dep[ci];
      if (cd >= DMAX) continue;
      var cx = ci % w, cy = (ci - cx) / w, nb = [];
      if (cx>0)   nb.push(ci-1);
      if (cx<w-1) nb.push(ci+1);
      if (cy>0)   nb.push(ci-w);
      if (cy<h-1) nb.push(ci+w);
      for (var nI=0; nI<nb.length; nI++){
        var n = nb[nI], no = n*4;
        if (p[no+3] === 0) continue;
        var nmn = Math.min(p[no], p[no+1], p[no+2]);
        var nmx = Math.max(p[no], p[no+1], p[no+2]);
        if (nmn < FLOOR || nmx - nmn > NEUT) continue;
        p[no+3] = 0; dep[n] = cd + 1; q[tail++] = n;
      }
    }

    /* омекотяване на ръба */
    for (var i2=0; i2<w*h; i2++){
      if (p[i2*4+3] === 0) continue;
      var xx2 = i2 % w, yy2 = (i2 - xx2) / w, touches = false;
      if (xx2>0   && p[(i2-1)*4+3] === 0) touches = true;
      if (xx2<w-1 && p[(i2+1)*4+3] === 0) touches = true;
      if (yy2>0   && p[(i2-w)*4+3] === 0) touches = true;
      if (yy2<h-1 && p[(i2+w)*4+3] === 0) touches = true;
      if (!touches) continue;
      var o = i2*4, mn = Math.min(p[o], p[o+1], p[o+2]);
      p[o+3] = Math.max(0, Math.min(255, Math.round((255 - mn) * 255 / (255 - TOL))));
    }
    changed = true;
  }

  /* граници по алфата */
  var l=w, t=h, r=0, b=0, found=false;
  for (var y3=0; y3<h; y3++){
    for (var x3=0; x3<w; x3++){
      if (p[(y3*w+x3)*4+3] > 12){
        found = true;
        if (x3<l) l=x3; if (x3>r) r=x3;
        if (y3<t) t=y3; if (y3>b) b=y3;
      }
    }
  }
  if (!found){ l=0; t=0; r=w-1; b=h-1; }
  var bw = r-l+1, bh = b-t+1;

  if (changed){ ctx.putImageData(id, 0, 0); img.src = c.toDataURL('image/png'); }

  var target = parseFloat(shot.dataset.height) || 500;
  shot.style.setProperty('--nw', w);
  shot.style.setProperty('--bl', l);
  shot.style.setProperty('--bt', t);
  shot.style.setProperty('--bw', bw);
  shot.style.setProperty('--bh', bh);
  shot.style.setProperty('--k', (target / bh).toFixed(4));
  document.documentElement.dataset.productBbox = [w,l,t,bw,bh].join(',');
}

/* ═══ 2) КУКА — свива шрифта, докато се събере в ширината ═══
   Дебелината на контура се мащабира със съотношението, зададено от
   темата, за да не се сплеска ореолът при дълга кука.            */
function fitHook(){
  var box  = document.querySelector('.z-hook'),
      hook = document.querySelector('.hook'),
      st   = document.querySelector('.hook .stroke'),
      size = parseFloat(getComputedStyle(hook).fontSize),
      sw   = parseFloat(getComputedStyle(st).webkitTextStrokeWidth) || size*0.11,
      ratio= sw / size;
  while (hook.getBoundingClientRect().width > box.clientWidth && size > 34){
    size -= 2;
    hook.style.fontSize = size + 'px';
    st.style.webkitTextStrokeWidth = Math.max(6, size * ratio) + 'px';
  }
  document.documentElement.dataset.hookSize = size;
}

(function(){
  var shot = document.querySelector('.shot'), img = shot.querySelector('img');
  function go(){ try { prepareProduct(img, shot); } catch(e){ document.documentElement.dataset.productError = e.message; } }
  if (img.complete && img.naturalWidth) go(); else img.onload = go;
  document.fonts.ready.then(fitHook);
})();
</script>
